[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adtreader"
version = "0.0.2"
description = "Pure-Python reader for Advantage Database Server (.adt) tables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
adt = "adtreader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adtreader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
